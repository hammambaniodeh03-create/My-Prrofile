<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch with Hammam Bani Odeh.">
  <title>Contact Me | Hammam Bani Odeh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Navigation ===== -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Hammam<span>.</span></a>
      <nav class="nav-links">
        <a href="index.html">&larr; Back to CV</a>
      </nav>
    </div>
  </header>

  <main class="contact-page">
    <div class="contact-card">
      <noscript>
        <p class="form-message">This page needs JavaScript to send your details. Please enable it and reload.</p>
      </noscript>

      <!-- Progress -->
      <ol class="steps" aria-label="Progress">
        <li class="step is-active" data-step="1" aria-current="step"><span>1</span>Details</li>
        <li class="step" data-step="2"><span>2</span>Done</li>
      </ol>

      <!-- Step 1: details -->
      <section id="step-details" class="panel is-visible">
        <h1>Contact me</h1>
        <p class="sub">Leave your details and I'll get back to you.</p>

        <form id="contact-form" novalidate>
          <div class="row">
            <div class="field">
              <label for="firstName">First name</label>
              <input type="text" id="firstName" name="firstName" autocomplete="given-name" aria-describedby="firstName-error" required>
              <small class="error" id="firstName-error"></small>
            </div>
            <div class="field">
              <label for="lastName">Last name</label>
              <input type="text" id="lastName" name="lastName" autocomplete="family-name" aria-describedby="lastName-error" required>
              <small class="error" id="lastName-error"></small>
            </div>
          </div>

          <div class="field">
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+962 7X XXX XXXX" aria-describedby="phone-error" required>
            <small class="error" id="phone-error"></small>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" aria-describedby="email-error" required>
            <small class="error" id="email-error"></small>
          </div>

          <p class="form-message" role="alert"></p>
          <button type="submit" class="btn btn-primary btn-block"><span class="btn-label">Send</span></button>
        </form>
      </section>

      <!-- Step 2: done -->
      <section id="step-success" class="panel">
        <div class="check">
          <svg viewBox="0 0 52 52" aria-hidden="true">
            <circle cx="26" cy="26" r="24" />
            <path d="M15 27 l7 7 l15 -15" />
          </svg>
        </div>
        <h1>Thanks, <span id="welcome-name"></span>!</h1>
        <p class="sub">Your details have been sent. I'll get back to you soon.</p>
        <a href="index.html" class="btn btn-outline">&larr; Back to CV</a>
      </section>
    </div>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"
    integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug"
    crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
