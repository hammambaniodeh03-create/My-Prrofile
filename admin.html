<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard | Hammam Bani Odeh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Navigation ===== -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Hammam<span>.</span></a>
      <nav class="nav-links">
        <a href="index.html">&larr; Back to CV</a>
      </nav>
    </div>
  </header>

  <main class="contact-page admin-page">
    <noscript>
      <p class="form-message">This page needs JavaScript. Please enable it and reload.</p>
    </noscript>

    <!-- Sign in -->
    <section id="login-view" class="contact-card" hidden>
      <h1>Sign in</h1>
      <p class="sub">Admin access only.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
          <button type="button" class="link-btn field-link" data-show="forgot-view">Forgot password?</button>
        </div>

        <p class="form-message" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block"><span class="btn-label">Sign in</span></button>
      </form>
    </section>

    <!-- Forgot password: request a reset link by email -->
    <section id="forgot-view" class="contact-card" hidden>
      <h1>Reset password</h1>
      <p class="sub">Enter your email and we'll send you a link to set a new password.</p>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" name="email" autocomplete="username" required>
        </div>

        <p class="form-message" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block"><span class="btn-label">Send reset link</span></button>
        <p class="form-footer">
          <button type="button" class="link-btn" data-show="login-view">&larr; Back to sign in</button>
        </p>
      </form>
    </section>

    <!-- Set a new password (opened from the link in the email) -->
    <section id="reset-view" class="contact-card" hidden>
      <h1>Set a new password</h1>
      <p class="sub">At least 6 characters.</p>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" name="password" autocomplete="new-password" minlength="6" required>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" name="confirm" autocomplete="new-password" minlength="6" required>
        </div>

        <p class="form-message" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block"><span class="btn-label">Update password</span></button>
      </form>
    </section>

    <!-- Dashboard -->
    <section id="dashboard-view" class="admin-panel" hidden>
      <div class="admin-header">
        <div>
          <h1>Contacts</h1>
          <p class="sub" id="contacts-count"></p>
        </div>
        <div class="admin-actions">
          <button type="button" id="refresh-btn" class="btn btn-outline btn-sm">Refresh</button>
          <button type="button" id="logout-btn" class="btn btn-primary btn-sm">Sign out</button>
        </div>
      </div>

      <p class="form-message" id="dashboard-message" role="alert"></p>

      <div class="table-wrap">
        <table class="contacts-table">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Name</th>
              <th scope="col">Phone</th>
              <th scope="col">Email</th>
              <th scope="col">Date</th>
            </tr>
          </thead>
          <tbody id="contacts-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"
    integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug"
    crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
